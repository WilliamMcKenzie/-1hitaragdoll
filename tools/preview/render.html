<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AssetKit preview</title>
<style>html,body{margin:0;height:100%;background:#7fc1f0;overflow:hidden}</style>
</head>
<body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// Rough offline preview of the parts dumped by tools/preview/mock.luau.
// window.PARTS = [...]; window.VIEW = {pos:[x,y,z], look:[x,y,z], fov}
import * as THREE from "three";

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86c5f2);
scene.fog = new THREE.Fog(0x9fd0f5, 300, 900);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x9a8a90, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(120, 260, 160);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 1, far: 1000 });
scene.add(sun);

function canvasTex(draw, size = 64) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// one stud per 1x1 stud tile
const studTex = canvasTex((g, s) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, s, s);
  g.fillStyle = "rgba(0,0,0,0.10)"; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s);
  g.fillStyle = "rgba(0,0,0,0.22)"; g.beginPath(); g.arc(s * .53, s * .56, s * .3, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,0.9)"; g.beginPath(); g.arc(s * .47, s * .45, s * .28, 0, 7); g.fill();
});
const inletTex = canvasTex((g, s) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, s, s);
  g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = s * 0.08; g.strokeRect(s * .25, s * .25, s * .5, s * .5);
});
const plainTex = canvasTex((g, s) => { g.fillStyle = "#fff"; g.fillRect(0, 0, s, s); });
const gridTex = canvasTex((g, s) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, s, s);
  g.fillStyle = "rgba(0,0,0,0.22)"; g.fillRect(0, 0, s, 3); g.fillRect(0, 0, 3, s);
}, 128);

const mats = new Map();
function mat(tex, col, neon) {
  const key = tex.uuid + col.join(",") + neon;
  if (!mats.has(key)) {
    const c = new THREE.Color().setRGB(col[0], col[1], col[2], THREE.SRGBColorSpace);
    mats.set(key, new THREE.MeshLambertMaterial({ map: tex, color: c, emissive: neon ? c : 0x000000, emissiveIntensity: neon ? 0.8 : 0 }));
  }
  return mats.get(key);
}
function texFor(surface) {
  if (surface === "SurfaceType.Studs") return studTex;
  if (surface === "SurfaceType.Inlet") return inletTex;
  return plainTex;
}

// box with UVs in stud units (so textures tile once per stud)
function studBox(sx, sy, sz, tileScale) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  const uv = geo.attributes.uv;
  const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f * 4 + v;
    uv.setXY(i, uv.getX(i) * dims[f][0] / tileScale, uv.getY(i) * dims[f][1] / tileScale);
  }
  return geo;
}
function wedgeGeo(sx, sy, sz) {
  const x = sx / 2, y = sy / 2, z = sz / 2;
  // tall side at +Z, slope down to -Z
  const shape = new THREE.Shape([new THREE.Vector2(-z, -y), new THREE.Vector2(z, -y), new THREE.Vector2(z, y)]);
  const g = new THREE.ExtrudeGeometry(shape, { depth: sx, bevelEnabled: false });
  g.rotateY(-Math.PI / 2); g.translate(x, 0, 0);
  return g;
}

for (const p of window.PARTS) {
  const [sx, sy, sz] = p.s;
  const neon = p.mat === "Material.Neon";
  let mesh;
  if (p.c === "WedgePart") {
    mesh = new THREE.Mesh(wedgeGeo(sx, sy, sz), mat(plainTex, p.col, neon));
  } else if (p.grid > 0 && p.tex === "rbxassetid://100359261064701") {
    // QM's stud tile: 4x4 studs per tile, drawn here as one stud per canvas tile
    mesh = new THREE.Mesh(studBox(sx, sy, sz, p.grid / 4), mat(studTex, p.col, false));
  } else if (p.grid > 0) {
    const g = studBox(sx, sy, sz, p.grid);
    mesh = new THREE.Mesh(g, mat(gridTex, p.col, false));
  } else {
    const side = mat(texFor(p.side), p.col, neon), top = mat(texFor(p.top), p.col, neon);
    mesh = new THREE.Mesh(studBox(sx, sy, sz, 1), [side, side, top, side, side, side]);
  }
  const r = p.r;
  const m = new THREE.Matrix4().set(r[0], r[1], r[2], p.p[0], r[3], r[4], r[5], p.p[1], r[6], r[7], r[8], p.p[2], 0, 0, 0, 1);
  mesh.applyMatrix4(m);
  mesh.castShadow = !(p.grid && p.tex !== "rbxassetid://100359261064701"); mesh.receiveShadow = true;
  scene.add(mesh);
}

const V = window.VIEW || { pos: [0, 120, 260], look: [0, 0, 0], fov: 55 };
const cam = new THREE.PerspectiveCamera(V.fov || 55, W / H, 0.5, 2000);
cam.position.set(...V.pos); cam.lookAt(...V.look);
renderer.render(scene, cam);
window.DONE = true;
</script>
</body>
</html>
